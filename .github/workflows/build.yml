name: Build Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Modiriat-Hesab-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Modiriat-Hesab-Android.apk

  windows:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Make portable zip
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath Modiriat-Hesab-Windows-Portable.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\setup.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            Modiriat-Hesab-Windows-Setup.exe
            Modiriat-Hesab-Windows-Portable.zip

  linux:
    name: Linux Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y ninja-build libgtk-3-dev zip dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Tarball
        run: |
          cp -r build/linux/x64/release/bundle modiriat-hesab
          tar czf Modiriat-Hesab-Linux.tar.gz modiriat-hesab
          rm -rf modiriat-hesab
      - name: Deb package
        run: |
          mkdir -p pkg/opt/modiriathesab pkg/usr/bin pkg/usr/share/applications pkg/DEBIAN
          cp -r build/linux/x64/release/bundle/* pkg/opt/modiriathesab/
          ln -sf /opt/modiriathesab/modiriat_hesab pkg/usr/bin/modiriat-hesab
          printf '[Desktop Entry]\nType=Application\nName=Modiriat Hesab\nExec=/opt/modiriathesab/modiriat_hesab\nTerminal=false\nCategories=Office;Finance;\n' > pkg/usr/share/applications/modiriat-hesab.desktop
          printf 'Package: modiriat-hesab\nVersion: 1.0.0\nSection: office\nPriority: optional\nArchitecture: amd64\nDepends: libgtk-3-0, libstdc++6\nDescription: Modiriat Hesab - Personal accounting app\n' > pkg/DEBIAN/control
          dpkg-deb --build pkg Modiriat-Hesab-Linux.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            Modiriat-Hesab-Linux.tar.gz
            Modiriat-Hesab-Linux.deb

  macos:
    name: macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: |
          cd build/macos/Build/Products/Release
          zip -r -q "$GITHUB_WORKSPACE/Modiriat-Hesab-macOS.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: Modiriat-Hesab-macOS.zip

  web:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - run: cd build/web && zip -r -q "$GITHUB_WORKSPACE/Modiriat-Hesab-Web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: Modiriat-Hesab-Web.zip

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows, linux, macos, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
